# Sensor / product band layouts: band name -> 1-based band index in the file.
# Verified visually with true-colour quicklooks (2026-10-02). Do not trust the
# files' own colour-interpretation tags: the SkySat file claims R,G,B but is B,G,R.

skysat:                 # Planet SkySat pansharpened, 4-band uint16, 0.5 m
  bands: {blue: 1, green: 2, red: 3, nir: 4}
  nodata: 0

vantor:                 # Vantor pansharpened "_RGB" products, 3-band uint16 (0.25-0.5 m)
  bands: {red: 1, green: 2, blue: 3}
  nodata: 0

vantor_4band:           # Vantor/Maxar standard 4-band order
  bands: {blue: 1, green: 2, red: 3, nir: 4}
  nodata: 0

vantor_8band:           # WorldView 8-band multispectral order
  bands: {coastal: 1, blue: 2, green: 3, yellow: 4, red: 5, rededge: 6, nir1: 7, nir2: 8}
  nodata: 0

worldview_2014_training: # the model's own training imagery (uint8, 0.324 m)
  bands: {blue: 1, green: 2, red: 3}
  nodata: null
